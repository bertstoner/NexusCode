server {
    listen 80;
    root /usr/share/nginx/html;

    # Redirect root to the app
    location = / {
        return 301 /__mockup/;
    }

    # Serve the Vite app (built with base path /__mockup)
    location /__mockup/ {
        try_files $uri $uri/ /__mockup/index.html;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
